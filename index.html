<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title> wayfare Trip Planner you'll actually take </title>
        <meta name="description" cotent="Wayfare is a friendly trip planner: build itineraries, track budgets, and discover destination with live waether and country data."/>
        <link rel="preconnect" href="https://fonts.googleapis.com"/>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossserigin/>
        <link href="https://fonts,googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Manrope:wght@400;500;700&family=Canveat:wght@500;700&display=swap" rel="stylesheet"/>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body data-page="home"
        <header class="site-header" id="siteHeader">
            <div class="container header-inner">
                <a href="index.html" class="brand" data-testid="brand-logo">
                    <span class="brand-mark">W</span>
                    <span class="brand-text">Wayfare</span>
                </a>
                </div>
            <nav class="site-nav" id="siteNav" aria-label="Main navigation">
                <ul>
                    <li><a href="index.html" class="active" data-testid="nav-home">Home</a></li>
                    <li><a href="destinations.html" data-testid="nav-destinations">Destination</a></li>
                    <li><a href="planner.html" data-testid="nav-planner">Planner</a><li>
                        
                </ul>

            </nav>
        </header>
            
        </header>

        <main>
            <form id="trip-form">
                <label for="from">From:</label>
                <input type="text" id="from" placeholder="Enter starting point">

                <label for="to">To:</label>
                <input type="text" id="to" placeholder="Enter destination">

                <label for="mode">Transport Mode:</label>
                <select id="mode">
                    <option value="bus">Bus</option>
                    <option value="train">Train</option>
                    <option value="bike">Bike</option>
                    <option value="walking">Walking</option>
                </select>

                <button type="submit">Plan Trip</button>
            </form>

            <section id="results">
                <h2>Trip Results</h2>
                <div id="trip-results"></div>
                <button id="new-trip">Plan Another Trip</button>
            </section>
        </main>

        <script src="script.js"></script>
    </body>
</html>
